name: CI

# Public-repo CI: test + build on every push to main and on PRs.
# Does NOT publish — publishing lives in release.yml (manual, pending review).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Must cover every version the generated pyproject advertises via its
        # `Programming Language :: Python :: X.Y` classifiers — those are what
        # the README's pyversions badge renders, and what users read as a
        # support claim. The private matrix (tests.yml) tests the same four.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (with test extra)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Run tests
        run: pytest -q -p no:cacheprovider

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build wheel + sdist (verify publishable; do not publish)
        run: |
          pip install build
          python -m build
      # Pinned by SHA to a node24 release. @v4 declares `using: node20`, which
      # GitHub now force-runs on Node 24 as that runtime retires — the same
      # substitution that broke action-gh-release (PR #78). No v4.x/v5.x release
      # declares node24; upload-artifact v7 and download-artifact v8 are the first.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/*
