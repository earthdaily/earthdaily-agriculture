name: Secret Scanning

# TruffleHog over git HISTORY, not just the files at the tip:
#   pull_request   the PR's own commits (base..head). Any finding fails, verified or not:
#                  a key-shaped string has no business in new code.
#   push to main   the commits the push added.
#   weekly/manual  every commit on every branch. Only LIVE keys fail (verified, or
#                  unverifiable): a key already revoked in history is noise, not risk.
#
# Findings are logged as detector + commit + file:line only. TruffleHog's own output
# prints the raw secret, which would copy every leak into the Actions log.
#
# Ships to the public earthdaily/earthdaily-agriculture mirror via the strip
# script (release/build_public_subset.py). Second-pass scan of what was
# actually shipped (the private repo runs the same scan pre-strip).
# On the public mirror this resolves to ubuntu-latest; on a private fork it
# would target the org-level `ed-runner-set` self-hosted runner.
# Keep in sync with .github/workflows/secret-scanning.yml.

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC: full-history scan
  workflow_dispatch:

env:
  # Pinned and checksum-verified (values from the release's checksums.txt).
  TRUFFLEHOG_VERSION: "3.99.0"
  TRUFFLEHOG_SHA256_AMD64: e35ae3fd1e4b7a0c1699d0fda1814282bf906d03379bd4337b092b3a84c6740b
  TRUFFLEHOG_SHA256_ARM64: ad6fb802f0e6f097829c1eee659b97fc0533a08fa34633cde15bc8fc3258dfb7

jobs:
  security-secrets:
    permissions:
      contents: read
    name: TruffleHog Secret Scan
    runs-on: ${{ github.repository_visibility == 'private' && 'ed-runner-set' || 'ubuntu-latest' }}
    container:
      image: alpine:3.22
    steps:
      - name: Install git and TruffleHog
        run: |
          set -eu
          apk add --no-cache git curl jq
          case "$(uname -m)" in
            x86_64)  arch=amd64; sum="$TRUFFLEHOG_SHA256_AMD64" ;;
            aarch64) arch=arm64; sum="$TRUFFLEHOG_SHA256_ARM64" ;;
            *) echo "Unsupported architecture: $(uname -m)"; exit 1 ;;
          esac
          tarball="trufflehog_${TRUFFLEHOG_VERSION}_linux_${arch}.tar.gz"
          curl -sSfL -o "/tmp/${tarball}" \
            "https://github.com/trufflesecurity/trufflehog/releases/download/v${TRUFFLEHOG_VERSION}/${tarball}"
          echo "${sum}  /tmp/${tarball}" | sha256sum -c -
          tar -xzf "/tmp/${tarball}" -C /usr/local/bin trufflehog
          trufflehog --version

      - name: Clone the repository (full history)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -eu
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          # A PR's head commits (forks included) are not on any branch of this repo.
          if [ -n "${PR_NUMBER}" ]; then
            git fetch --quiet origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/origin/pr-head"
          fi

      - name: Scan
        working-directory: repo
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -eu
          case "$EVENT" in
            pull_request)
              results=verified,unknown,unverified
              set -- --since-commit "$PR_BASE" --branch "$PR_HEAD"
              echo "Scanning PR commits ${PR_BASE}..${PR_HEAD}" ;;
            push)
              results=verified,unknown,unverified
              if [ -n "$PUSH_BEFORE" ] && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
                set -- --since-commit "$PUSH_BEFORE" --branch "$PUSH_AFTER"
                echo "Scanning pushed commits ${PUSH_BEFORE}..${PUSH_AFTER}"
              else
                set -- --branch "$PUSH_AFTER"  # new branch or force-push: everything reachable
                echo "Scanning all history reachable from ${PUSH_AFTER}"
              fi ;;
            *)
              results=verified,unknown
              set --
              echo "Scanning the full history of every branch (live keys only)" ;;
          esac

          # --json keeps TruffleHog's exit code (183 = findings) separate from the
          # redacted report below; piping straight into jq used to swallow it.
          status=0
          trufflehog git file://. "$@" --results="$results" --fail --no-update --json > /tmp/findings.json || status=$?

          count=$(grep -c '^{' /tmp/findings.json || true)
          if [ "$count" -gt 0 ]; then
            echo "::error::TruffleHog found ${count} secret(s). Rotate them first: removing a key from git does not revoke it."
            # Location only: TruffleHog's `.Redacted` is not safe to log (for some
            # detectors it is most of the key), and `.Raw` / `.RawV2` are the secret.
            jq -r 'select(.DetectorName) | "\(.DetectorName)  verified=\(.Verified)  \(.SourceMetadata.Data.Git.commit[0:8])  \(.SourceMetadata.Data.Git.file):\(.SourceMetadata.Data.Git.line)"' /tmp/findings.json
          else
            echo "No secrets found."
          fi
          exit "$status"
